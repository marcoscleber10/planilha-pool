<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquidity Pool Manager</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f0f0;
            font-size: 11px;
            overflow-x: auto;
        }

        /* Toolbar Superior */
        .toolbar {
            background: #217346;
            color: white;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #1a5c37;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .toolbar-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-toolbar {
            background: white;
            color: #217346;
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
        }

        .btn-toolbar:hover {
            background: #f5f5f5;
        }

        /* Tabs */
        .tabs {
            background: #f8f9fa;
            border-bottom: 1px solid #dadce0;
            display: flex;
            padding: 0 10px;
            gap: 2px;
        }

        .tab {
            padding: 10px 24px;
            background: #e8eaed;
            border: 1px solid #dadce0;
            border-bottom: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 12px;
            border-radius: 4px 4px 0 0;
            margin-bottom: -1px;
            color: #5f6368;
        }

        .tab.active {
            background: white;
            color: #217346;
            font-weight: 600;
            border-bottom: 1px solid white;
        }

        .tab:hover:not(.active) {
            background: #f1f3f4;
        }

        /* Formula Bar */
        .formula-bar {
            background: white;
            border-bottom: 1px solid #dadce0;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .formula-label {
            color: #5f6368;
            font-weight: 600;
            font-style: italic;
            min-width: 20px;
        }

        .formula-input {
            flex: 1;
            border: 1px solid #dadce0;
            padding: 4px 8px;
            font-size: 11px;
            font-family: inherit;
            background: #f8f9fa;
        }

        /* Container Principal */
        .spreadsheet-container {
            background: white;
            margin: 15px;
            border: 1px solid #dadce0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        /* Tabela */
        .spreadsheet {
            border-collapse: collapse;
            width: 100%;
            min-width: 1400px;
            font-size: 11px;
        }

        .spreadsheet th {
            background: #217346;
            color: white;
            font-weight: 600;
            padding: 10px 8px;
            border: 1px solid #1a5c37;
            text-align: left;
            font-size: 11px;
            white-space: nowrap;
        }

        .spreadsheet td {
            border: 1px solid #e0e0e0;
            padding: 6px 8px;
            font-size: 11px;
        }

        .spreadsheet tr:nth-child(even) {
            background: #f8f9f8;
        }

        .spreadsheet tr:hover {
            background: #e8f5e9;
        }

        /* Inputs nas células */
        .cell-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 11px;
            font-family: inherit;
            padding: 2px;
        }

        .cell-input:focus {
            outline: 2px solid #217346;
            background: white;
            position: relative;
            z-index: 10;
        }

        .cell-number {
            text-align: right;
        }

        .cell-center {
            text-align: center;
        }

        /* Cores de status */
        .positive {
            color: #0f7b0f;
            font-weight: 600;
        }

        .negative {
            color: #c50f1f;
            font-weight: 600;
        }

        /* Linha de Filtros */
        .filter-row td {
            background: #f8f9fa;
            padding: 4px 8px;
        }

        .filter-input {
            width: 100%;
            border: 1px solid #dadce0;
            padding: 4px;
            font-size: 10px;
            border-radius: 2px;
        }

        /* Botão Adicionar */
        .add-row {
            background: #e8f5e9;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            color: #217346;
            font-weight: 600;
            border: 1px dashed #217346;
            border-top: none;
            transition: background 0.2s;
        }

        .add-row:hover {
            background: #c8e6c9;
        }

        /* Resumo */
        .summary-row {
            background: #f1f8e9;
            font-weight: 600;
        }

        .summary-row td {
            border-top: 2px solid #217346;
            padding: 8px;
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .toolbar {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
            
            .toolbar-buttons {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .spreadsheet-container {
                margin: 5px;
            }
        }
    </style>
</head>
<body>
    <!-- Toolbar -->
    <div class="toolbar">
        <div class="toolbar-title">
            💰 Liquidity Pool Manager
        </div>
        <div class="toolbar-buttons">
            <button class="btn-toolbar" onclick="addNewRow()">
                <span>+</span> Nova Linha
            </button>
            <button class="btn-toolbar" onclick="calculateAll()">
                <span>📊</span> Calcular
            </button>
            <button class="btn-toolbar" onclick="exportToExcel()">
                <span>📥</span> Exportar Excel
            </button>
            <button class="btn-toolbar" onclick="saveData()">
                <span>💾</span> Salvar
            </button>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active">PULSE</div>
        <div class="tab">REPORT</div>
        <div class="tab">ANALYTICS</div>
    </div>

    <!-- Formula Bar -->
    <div class="formula-bar">
        <span class="formula-label">fx</span>
        <input type="text" class="formula-input" placeholder="Selecione uma célula para ver a fórmula" readonly>
    </div>

    <!-- Planilha -->
    <div class="spreadsheet-container">
        <table class="spreadsheet" id="mainTable">
            <thead>
                <tr>
                    <th>DEX</th>
                    <th>PAR</th>
                    <th>NOVA CONTRIBUIÇÃO ($)</th>
                    <th>VALOR APLICADO ($)</th>
                    <th>INÍCIO</th>
                    <th>RANGE (%)</th>
                    <th>FEES ($)</th>
                    <th>RO (%)</th>
                    <th>FIM</th>
                    <th>IMPERMANENT LOSS</th>
                    <th>SALDO FINAL ($)</th>
                </tr>
                <tr class="filter-row">
                    <td><input type="text" class="filter-input" placeholder="Filtrar DEX"></td>
                    <td><input type="text" class="filter-input" placeholder="Filtrar Par"></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Dados serão inseridos via JavaScript -->
            </tbody>
            <tfoot>
                <tr class="summary-row">
                    <td colspan="3" style="text-align: right;">TOTAIS:</td>
                    <td class="cell-number" id="totalApplied">$0</td>
                    <td></td>
                    <td></td>
                    <td class="cell-number positive" id="totalFees">$0</td>
                    <td class="cell-number" id="avgRO">0.00%</td>
                    <td></td>
                    <td></td>
                    <td class="cell-number" id="totalBalance">$0</td>
                </tr>
            </tfoot>
        </table>
        <div class="add-row" onclick="addNewRow()">
            + ADICIONAR NOVA POOL
        </div>
    </div>

    <script>
        // Dados iniciais (exatamente como no vídeo)
        let poolsData = [
            { dex: 'Uniswap V3', pair: 'ETH/USDC', contribution: 5000, applied: 5000, start: '15/01/2024', range: 20, fees: 125, ro: 0, end: '', il: '0.0234 ETH', balance: 5125.00 },
            { dex: 'PancakeSwap', pair: 'BNB/BUSD', contribution: 3000, applied: 3000, start: '20/01/2024', range: 15, fees: 89, ro: 0, end: '', il: '0.15 BNB', balance: 3089.00 },
            { dex: 'Orca', pair: 'SOL/USDC', contribution: 2000, applied: 2000, start: '01/02/2024', range: 25, fees: 67, ro: 0, end: '', il: '1.2 SOL', balance: 2067.00 }
        ];

        // Carregar dados salvos
        function loadData() {
            const saved = localStorage.getItem('lp_pools_data');
            if (saved) {
                poolsData = JSON.parse(saved);
            }
            renderTable();
        }

        // Renderizar tabela
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            poolsData.forEach((pool, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="text" class="cell-input" value="${pool.dex}" onchange="updatePool(${index}, 'dex', this.value)"></td>
                    <td><input type="text" class="cell-input" value="${pool.pair}" onchange="updatePool(${index}, 'pair', this.value)"></td>
                    <td><input type="number" class="cell-input cell-number" value="${pool.contribution}" onchange="updatePool(${index}, 'contribution', parseFloat(this.value))"></td>
                    <td><input type="number" class="cell-input cell-number" value="${pool.applied}" onchange="updatePool(${index}, 'applied', parseFloat(this.value))"></td>
                    <td><input type="text" class="cell-input" value="${pool.start}" onchange="updatePool(${index}, 'start', this.value)"></td>
                    <td><input type="number" class="cell-input cell-number" value="${pool.range}" onchange="updatePool(${index}, 'range', parseFloat(this.value))"></td>
                    <td><input type="number" class="cell-input cell-number" value="${pool.fees}" onchange="updatePool(${index}, 'fees', parseFloat(this.value)); calculateRO(${index});"></td>
                    <td class="cell-number ${getROClass(pool.ro)}">${pool.ro.toFixed(2)}%</td>
                    <td><input type="text" class="cell-input" value="${pool.end}" onchange="updatePool(${index}, 'end', this.value)"></td>
                    <td><input type="text" class="cell-input" value="${pool.il}" onchange="updatePool(${index}, 'il', this.value)"></td>
                    <td class="cell-number">${pool.balance.toFixed(2)}</td>
                `;
                tbody.appendChild(tr);
            });

            updateTotals();
        }

        // Atualizar pool
        function updatePool(index, field, value) {
            poolsData[index][field] = value;
            if (field === 'fees' || field === 'applied') {
                calculateRO(index);
            }
            if (field === 'fees' || field === 'applied' || field === 'contribution') {
                calculateBalance(index);
            }
            updateTotals();
            saveData();
        }

        // Calcular RO
        function calculateRO(index) {
            const pool = poolsData[index];
            if (pool.applied > 0) {
                pool.ro = (pool.fees / pool.applied) * 100;
                renderTable();
            }
        }

        // Calcular saldo
        function calculateBalance(index) {
            const pool = poolsData[index];
            pool.balance = pool.applied + pool.fees;
            renderTable();
        }

        // Calcular todos
        function calculateAll() {
            poolsData.forEach((pool, index) => {
                calculateRO(index);
                calculateBalance(index);
            });
            alert('Cálculos realizados com sucesso!');
        }

        // Classe para RO
        function getROClass(ro) {
            if (ro > 5) return 'positive';
            if (ro < 0) return 'negative';
            return '';
        }

        // Adicionar nova linha
        function addNewRow() {
            poolsData.push({
                dex: '',
                pair: '',
                contribution: 0,
                applied: 0,
                start: new Date().toLocaleDateString('pt-BR'),
                range: 0,
                fees: 0,
                ro: 0,
                end: '',
                il: '',
                balance: 0
            });
            renderTable();
        }

        // Atualizar totais
        function updateTotals() {
            const totalApplied = poolsData.reduce((sum, p) => sum + (parseFloat(p.applied) || 0), 0);
            const totalFees = poolsData.reduce((sum, p) => sum + (parseFloat(p.fees) || 0), 0);
            const totalBalance = poolsData.reduce((sum, p) => sum + (parseFloat(p.balance) || 0), 0);
            const avgRO = poolsData.length > 0 ? poolsData.reduce((sum, p) => sum + (parseFloat(p.ro) || 0), 0) / poolsData.length : 0;

            document.getElementById('totalApplied').textContent = '$' + totalApplied.toFixed(2);
            document.getElementById('totalFees').textContent = '$' + totalFees.toFixed(2);
            document.getElementById('totalBalance').textContent = '$' + totalBalance.toFixed(2);
            document.getElementById('avgRO').textContent = avgRO.toFixed(2) + '%';
        }

        // Salvar dados
        function saveData() {
            localStorage.setItem('lp_pools_data', JSON.stringify(poolsData));
            // Mostrar mensagem breve
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span>✓</span> Salvo!';
            setTimeout(() => {
                btn.innerHTML = originalText;
            }, 2000);
        }

        // Exportar para Excel
        function exportToExcel() {
            const wb = XLSX.utils.book_new();
            
            const wsData = poolsData.map(pool => ({
                'DEX': pool.dex,
                'PAR': pool.pair,
                'NOVA CONTRIBUIÇÃO ($)': pool.contribution,
                'VALOR APLICADO ($)': pool.applied,
                'INÍCIO': pool.start,
                'RANGE (%)': pool.range,
                'FEES ($)': pool.fees,
                'RO (%)': pool.ro.toFixed(2),
                'FIM': pool.end,
                'IMPERMANENT LOSS': pool.il,
                'SALDO FINAL ($)': pool.balance.toFixed(2)
            }));

            const ws = XLSX.utils.json_to_sheet(wsData);
            
            // Ajustar largura das colunas
            const wscols = [
                {wch: 15}, {wch: 15}, {wch: 20}, {wch: 18},
                {wch: 12}, {wch: 10}, {wch: 12}, {wch: 10},
                {wch: 12}, {wch: 18}, {wch: 15}
            ];
            ws['!cols'] = wscols;

            XLSX.utils.book_append_sheet(wb, ws, "PULSE");
            XLSX.writeFile(wb, `Liquidity_Pools_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        // Filtrar tabela
        document.querySelectorAll('.filter-input').forEach(input => {
            input.addEventListener('input', function() {
                const filters = Array.from(document.querySelectorAll('.filter-input')).map(i => i.value.toLowerCase());
                const rows = document.querySelectorAll('#tableBody tr');
                
                rows.forEach((row, index) => {
                    const dex = row.cells[0].querySelector('input').value.toLowerCase();
                    const pair = row.cells[1].querySelector('input').value.toLowerCase();
                    
                    const matchDex = !filters[0] || dex.includes(filters[0]);
                    const matchPair = !filters[1] || pair.includes(filters[1]);
                    
                    row.style.display = (matchDex && matchPair) ? '' : 'none';
                });
            });
        });

        // Inicializar
        window.onload = function() {
            loadData();
        };
    </script>
</body>
</html>
